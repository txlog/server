name: Check
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:

  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.6'

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Lint
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
        golangci-lint run ./...

    # No PostgreSQL service here: the suite needs a migrated txlog_test
    # database, and nothing in the test packages applies the migrations, so
    # every database-backed test skips itself. This step still catches
    # compilation errors in test files and runs the tests that need no
    # database. See tests/README.md.
    - name: Test
      run: go test ./...
