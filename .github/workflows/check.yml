name: Check
on:
  push:
    branches:
      - "**"
  pull_request:

jobs:

  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: txlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d txlog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.6'

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Lint
      run: |
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
        golangci-lint run ./...

    # The suite applies the migrations itself, from TestMain in each package
    # with database-backed tests. TXLOG_TEST_REQUIRE_DB makes an unreachable
    # database a failure instead of a skip, so a service that fails to start
    # cannot leave this step green with nothing run. See tests/README.md.
    - name: Test
      env:
        TXLOG_TEST_REQUIRE_DB: "1"
      run: go test ./...
