<!doctype html>
<html lang="en" data-mode="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Txlog Server: Internal Server Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body
  class="font-sans antialiased min-h-screen flex flex-col items-center justify-center border-t-4 border-kumo-danger bg-kumo-canvas text-kumo-default">
  <div class="max-w-lg mx-auto px-4 py-8 text-center">
    <div class="font-bold text-8xl text-kumo-muted mb-4">500</div>
    <h1 class="font-bold text-2xl mb-2">Oops… You just found an error page</h1>
    <p class="text-kumo-subtle mb-8">We are sorry but our server encountered an internal error</p>
    <a href="/"
       data-kumo-component="Button"
       class="inline-flex items-center gap-2 bg-kumo-brand text-white font-medium px-6 py-3 rounded-lg hover:bg-kumo-brand/90 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-kumo-brand">
      {{ template "icon-phone-outgoing" "w-4 h-4" }}
      Take me home
    </a>
  </div>
  <div class="max-w-4xl w-full mx-auto px-4 mt-8 text-left">
    <div class="bg-kumo-control rounded-lg shadow-sm border border-kumo-line p-6">
      <h4 class="font-semibold text-lg mb-3">Reported error</h4>
      <pre
        class="bg-kumo-control text-kumo-default border border-kumo-line p-4 rounded-lg overflow-x-auto font-mono text-sm"><code>{{ .error }}</code></pre>
    </div>
  </div>
</body>

</html>
